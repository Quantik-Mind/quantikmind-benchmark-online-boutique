name: quantikmind-online-boutique-benchmark

services:
  online-boutique-frontend:
    image: alpine/socat:1.8.0.0
    command:
      - tcp-listen:8080,fork,reuseaddr
      - tcp-connect:host.docker.internal:${ONLINE_BOUTIQUE_HOST_PORT:-8080}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - benchmark

  blackbox-exporter:
    image: prom/blackbox-exporter:v0.25.0
    command:
      - --config.file=/etc/blackbox_exporter/config.yml
    volumes:
      - ./prometheus/blackbox.yml:/etc/blackbox_exporter/config.yml:ro
    networks:
      - benchmark

  prometheus:
    image: prom/prometheus:v2.55.1
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.console.libraries=/usr/share/prometheus/console_libraries
      - --web.console.templates=/usr/share/prometheus/consoles
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    networks:
      - benchmark
    depends_on:
      - blackbox-exporter

  playwright-runner:
    image: mcr.microsoft.com/playwright:v1.60.0-jammy
    profiles:
      - tools
    working_dir: /workspace/qmind-test-harness/playwright
    environment:
      FRONTEND_URL: ${ONLINE_BOUTIQUE_FRONTEND_URL:-http://online-boutique-frontend:8080}
    volumes:
      - .:/workspace
    networks:
      - benchmark
    command: ["sh", "-lc", "npm ci && npx playwright test --list"]

  traffic-standard:
    image: curlimages/curl:8.10.1
    profiles:
      - traffic
    environment:
      ONLINE_BOUTIQUE_FRONTEND_URL: ${ONLINE_BOUTIQUE_FRONTEND_URL:-http://online-boutique-frontend:8080}
      TRAFFIC_DURATION_SECONDS: ${TRAFFIC_DURATION_SECONDS:-300}
      TRAFFIC_SLEEP_SECONDS: ${TRAFFIC_SLEEP_SECONDS:-2}
    networks:
      - benchmark
    depends_on:
      - online-boutique-frontend
    command:
      - sh
      - -lc
      - |
        set -eu
        base="$${ONLINE_BOUTIQUE_FRONTEND_URL%/}"
        end=$$(($$(date +%s) + $${TRAFFIC_DURATION_SECONDS}))
        while [ $$(date +%s) -lt "$$end" ]; do
          curl -fsS -o /dev/null "$$base/"
          curl -fsS -o /dev/null "$$base/product/OLJCESPC7Z"
          curl -fsS -o /dev/null "$$base/product/66VCHSJNUP"
          curl -fsS -o /dev/null "$$base/cart"
          sleep "$${TRAFFIC_SLEEP_SECONDS}"
        done

  traffic-spike:
    image: curlimages/curl:8.10.1
    profiles:
      - traffic
      - spike
    environment:
      ONLINE_BOUTIQUE_FRONTEND_URL: ${ONLINE_BOUTIQUE_FRONTEND_URL:-http://online-boutique-frontend:8080}
      SPIKE_DURATION_SECONDS: ${SPIKE_DURATION_SECONDS:-180}
      SPIKE_SLEEP_SECONDS: ${SPIKE_SLEEP_SECONDS:-1}
      SPIKE_PATH: ${SPIKE_PATH:-/product/OLJCESPC7Z}
    networks:
      - benchmark
    depends_on:
      - online-boutique-frontend
    command:
      - sh
      - -lc
      - |
        set -eu
        base="$${ONLINE_BOUTIQUE_FRONTEND_URL%/}"
        end=$$(($$(date +%s) + $${SPIKE_DURATION_SECONDS}))
        while [ $$(date +%s) -lt "$$end" ]; do
          curl -fsS -o /dev/null "$$base$${SPIKE_PATH}"
          sleep "$${SPIKE_SLEEP_SECONDS}"
        done

  qmind-runner:
    image: python:3.12-slim
    profiles:
      - qmind
    working_dir: /workspace
    env_file:
      - path: .env
        required: false
    environment:
      QMIND_HOME: /workspace/qmind-home
    volumes:
      - .:/workspace
    networks:
      - benchmark
    command:
      - sh
      - -lc
      - |
        echo "qmind-runner is a placeholder until the Quantik Mind CLI package or image is pinned."
        echo "For now, install/run qmind on the host and use qmind.example.yaml plus the README flow."
        sleep infinity

networks:
  benchmark:
    name: qmind-online-boutique-benchmark

volumes:
  prometheus-data:
