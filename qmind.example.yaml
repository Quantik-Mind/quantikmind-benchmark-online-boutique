api_url: ${QMIND_API_URL}
api_key: ${QMIND_API_KEY}
project_id: ${QMIND_PROJECT_ID}
project_name: ${QMIND_PROJECT_NAME}
framework: playwright
test_dir: qmind-test-harness/playwright/tests
results_dir: qmind-test-harness/playwright/test-results

agent:
  prometheus_url: ${PROMETHEUS_URL}
  push_interval_seconds: 60

observability:
  provider: prometheus
  service_label: deployment
  mode: file
  selected_job: null
  profile_ready: true

benchmark:
  test_library: qmind-test-library/online-boutique-playwright-51.json
  run_dir: benchmark-runs/qmind-online-boutique
  final_comparison: benchmark-results/final-comparison/final-comparison.json
