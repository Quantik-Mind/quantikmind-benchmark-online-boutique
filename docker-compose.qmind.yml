services:
  qmind-runner:
    image: python:3.12-slim
    volumes:
      - .:/workspace
      - ./qmind-home:/root/.qmind
    working_dir: /workspace
    command:
      - sh
      - -lc
      - |
        echo "This legacy qmind compose service is now a placeholder."
        echo "Use docker-compose.benchmark.yml for the reproducibility stack."
        echo "PR 2 should pin a packaged qmind CLI image or install path."
        sleep infinity
    environment:
      QMIND_HOME: /root/.qmind
